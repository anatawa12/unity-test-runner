name: Build and publish docker image
on:
  workflow_dispatch:
    inputs:
      force-push:
        type: boolean
      image:
        type: choice
        options:
          - license-client
          - activator
  schedule:
    - cron: 0 0 1 * *

permissions:
  contents: read
  packages: write

env:
  IMAGE_TYPE: ${{ inputs.image || 'license-client' }}
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/unity-test-runner/${{ inputs.image || 'license-client' }}

jobs:
  release:
    name: Build license client and publish if there are resonable changes
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@v7

      # environment setup and checkout
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # try building image
      - name: Build ${{ env.IMAGE_TYPE }} image
        run: |-
          docker build - -t built-temp < containers/${IMAGE_TYPE}.Dockerfile

      - name: Check if new build changed something matters
        id: image-changed
        if: ${{ !inputs.force-push }}
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:1
        run: |-
          mkdir work && cd work
          docker pull "${IMAGE_TAG}"

          mkdir published
          docker create --name published "${IMAGE_TAG}"
          docker export published | tar x -C published

          mkdir built
          docker create --name built "built-temp"
          docker export built | tar x -C built

          # remove files generated by docker
          rm {published,built}/etc/{hostname,hosts}

          if diff --no-dereference -qr published built; then
            echo "No container difference detected! Skipping tagging and pushing"
            echo "same=true" >> $GITHUB_OUTPUT
          fi

      - name: Tag and push
        if: ${{ !steps.image-changed.outputs.same }}
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:1
        run: |-
          docker tag "built-temp" "${IMAGE_TAG}"
          docker push "${IMAGE_TAG}"
